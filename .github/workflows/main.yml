name: Playit RDP Tunnel (With Checkpoint Resume)

on:
  workflow_dispatch:
    inputs:
      restore_checkpoint:
        description: 'Restore from last checkpoint? (yes/no)'
        required: false
        default: 'yes'

jobs:
  setup-rdp-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      # ─────────────────────────────────────────────
      # STEP 1: Checkout repo
      # ─────────────────────────────────────────────
      - name: Check out the repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # STEP 2: Restore checkpoint from cache
      # ─────────────────────────────────────────────
      - name: Restore Checkpoint Cache
        id: restore-cache
        if: ${{ github.event.inputs.restore_checkpoint == 'yes' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Users\runneradmin\Desktop\MyWork
            C:\checkpoint_data
          key: rdp-checkpoint-main
          restore-keys: |
            rdp-checkpoint-

      - name: Check Checkpoint Status
        run: |
          if (Test-Path "C:\checkpoint_data\checkpoint.txt") {
            $info = Get-Content "C:\checkpoint_data\checkpoint.txt"
            Write-Host "=== CHECKPOINT FOUND ==="
            Write-Host $info
            Write-Host "========================"
          } else {
            Write-Host "No checkpoint found - starting fresh session"
          }

      # ─────────────────────────────────────────────
      # STEP 3: Enable Remote Desktop
      # ─────────────────────────────────────────────
      - name: Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "p@ssw0rd!" -Force)
          Write-Host "RDP Enabled. Username: runneradmin | Password: p@ssw0rd!"

      # ─────────────────────────────────────────────
      # STEP 4: Setup Work Directories & Session Info
      # ─────────────────────────────────────────────
      - name: Setup Work Directories
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Users\runneradmin\Desktop\MyWork" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\checkpoint_data" | Out-Null
          
          $sessionInfo = @"
          === RDP Session Info ===
          Started: $(Get-Date)
          Username: runneradmin
          Password: p@ssw0rd!
          
          Your files are saved in: C:\Users\runneradmin\Desktop\MyWork
          Checkpoints auto-save every 50 minutes.
          "@
          Set-Content -Path "C:\Users\runneradmin\Desktop\SESSION_INFO.txt" -Value $sessionInfo

      # ─────────────────────────────────────────────
      # STEP 5: Download and Start Ngrok TCP Tunnel
      # ─────────────────────────────────────────────
      - name: Start Ngrok TCP Tunnel
        run: |
          Write-Host "Downloading Ngrok..."
          Invoke-WebRequest -Uri https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath "$env:USERPROFILE" -Force
          
          # Configure your provided Ngrok Authtoken
          Write-Host "Configuring Ngrok Authtoken..."
          & "$env:USERPROFILE\ngrok.exe" config add-authtoken "3KV0DEtfhjBSZs2HAF01yakaM27_64mWy6X7JFrRbWUjFsXGM"

          Write-Host "Starting Ngrok TCP tunnel for port 3389..."
          Start-Process -FilePath "$env:USERPROFILE\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 5

          # Automatically parse and output the public TCP address from Ngrok's local API
          try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
            $tcpTunnel = $response.tunnels | Where-Object { $_.proto -eq "tcp" }
            $publicUrl = $tcpTunnel.public_url # Example: tcp://0.tcp.in.ngrok.io:12345
            
            Write-Host "============================================================"
            Write-Host " RDP DIRECT CONNECTION DETAILS                              "
            Write-Host "============================================================"
            Write-Host " Copy this address into Windows Remote Desktop (mstsc):     "
            Write-Host " $publicUrl                                                 "
            Write-Host "------------------------------------------------------------"
            Write-Host " Login Credentials:                                         "
            Write-Host " - Username: runneradmin                                    "
            Write-Host " - Password: p@ssw0rd!                                      "
            Write-Host "============================================================"
          } catch {
            Write-Host "Could not automatically parse tunnel URL. Please check live runner logs above."
          }

      # ─────────────────────────────────────────────
      # STEP 6: Auto-checkpoint loop + keep alive
      # ─────────────────────────────────────────────
      - name: Keep Alive + Auto Checkpoint Every 50 Minutes
        run: |
          $totalMinutes = 320   # ~5 hr 20 min (leaves buffer for final save)
          $checkpointEvery = 50 # Save every 50 minutes
          $elapsed = 0

          Write-Host "Session running. Will auto-checkpoint every $checkpointEvery minutes."

          while ($elapsed -lt $totalMinutes) {
            $waitMinutes = [Math]::Min($checkpointEvery, $totalMinutes - $elapsed)
            Write-Host "--- Sleeping $waitMinutes min | Total elapsed: $elapsed min ---"
            Start-Sleep -Seconds ($waitMinutes * 60)
            $elapsed += $waitMinutes

            # Save checkpoint state
            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $checkpointText = @"
          Last checkpoint: $timestamp
          Session elapsed: $elapsed minutes
          Files are in: C:\Users\runneradmin\Desktop\MyWork
          "@
            Set-Content -Path "C:\checkpoint_data\checkpoint.txt" -Value $checkpointText
            Write-Host "=== CHECKPOINT SAVED at $timestamp (elapsed: $elapsed min) ==="
          }

          Write-Host "Session ending. Performing final checkpoint save..."

      # ─────────────────────────────────────────────
      # STEP 7: Final checkpoint save & cache upload
      # ─────────────────────────────────────────────
      - name: Save Final Checkpoint
        if: always()
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          New-Item -ItemType Directory -Force -Path "C:\checkpoint_data" | Out-Null
          Set-Content -Path "C:\checkpoint_data\checkpoint.txt" -Value "Last checkpoint: $timestamp`nSession ended gracefully."
          Write-Host "Final checkpoint written at $timestamp"

      - name: Upload Checkpoint as Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-session-checkpoint
          path: |
            C:\Users\runneradmin\Desktop\MyWork
            C:\checkpoint_data\checkpoint.txt
          retention-days: 30

      - name: Save Checkpoint to Cache (For Next Run Resume)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            C:\Users\runneradmin\Desktop\MyWork
            C:\checkpoint_data
          key: rdp-checkpoint-main
